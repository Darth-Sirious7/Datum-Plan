[package]
name = "datum-plan"
version = "0.6.1"
edition = "2021"
description = "Datum Plan: project scheduling for Windows."
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
datum-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "2", features = ["json", "native-certs"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
# Save as PDF straight from the WebView (no print window, no browser header or footer).
webview2-com = "0.39"
windows-core = "0.62"
